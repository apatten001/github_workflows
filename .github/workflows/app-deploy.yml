name: App Deployment to ECR

on:
  workflow_call:
    inputs:
      dockerfile_dir:
        description: 'Directory containing Dockerfile'
        type: string
        required: false
        default: '.'
      aws_region:
        description: 'AWS region for deployment'
        type: string
        required: true
      aws_role_arn:
        description: 'ARN of the IAM role to assume for AWS access (OIDC)'
        type: string
        required: true
      ecr_repository:
        description: 'Name of the ECR repository'
        type: string
        required: true
      

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{ inputs.ecr_repository }}:$IMAGE_TAG ${{ inputs.dockerfile_dir }}
          docker push $ECR_REGISTRY/${{ inputs.ecr_repository }}:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/${{ inputs.ecr_repository }}:$IMAGE_TAG" >> $GITHUB_OUTPUT
        id: build-image
