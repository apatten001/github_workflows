name: IaC Deployment with Wiz Scan

on:
  workflow_call:
    inputs:
      terraform_dir:
        description: 'Directory containing Terraform code'
        type: string
        required: false
        default: '.'
      aws_region:
        description: 'AWS region for deployment'
        type: string
        required: true
      aws_role_arn:
        description: 'ARN of the IAM role to assume for AWS access (OIDC)'
        type: string
        required: true
      terraform_action:
        description: 'Terraform action to perform (plan or apply)'
        type: string
        required: false
        default: 'plan'
    secrets:
      WIZ_CLIENT_ID:
        description: 'Wiz API client ID'
        required: true
      WIZ_CLIENT_SECRET:
        description: 'Wiz API client secret'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  wiz-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Wiz CLI
        run: |
          curl -s -o wizcli https://wizcli.app.wiz.io/latest/wizcli
          chmod +x wizcli

      - name: Authenticate Wiz CLI
        run: ./wizcli auth --id ${{ secrets.WIZ_CLIENT_ID }} --secret ${{ secrets.WIZ_CLIENT_SECRET }}

      - name: Run Wiz IaC Scan
        run: ./wizcli iac scan --path ${{ inputs.terraform_dir }} --threshold critical  # Fails on critical issues; adjust threshold as needed

  terraform-deploy:
    runs-on: ubuntu-latest
    needs: wiz-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.7  # Use latest stable version

      - name: Terraform Init
        working-directory: ${{ inputs.terraform_dir }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ inputs.terraform_dir }}
        run: terraform validate

      - name: Terraform Plan
        if: inputs.terraform_action == 'plan' || inputs.terraform_action == 'apply'
        working-directory: ${{ inputs.terraform_dir }}
        run: terraform plan -out=plan.tfout

      - name: Terraform Apply
        if: inputs.terraform_action == 'apply'
        working-directory: ${{ inputs.terraform_dir }}
        run: terraform apply -auto-approve plan.tfout