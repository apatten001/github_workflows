name: Deploy RDS

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment (e.g.,dev, test, prod)'
        required: true
        type: string
      aws-region:
        description: 'AWS Region'
        required: true
        type: string
        default: 'us-east-2'
      terraform-version:
        description: 'Terraform Version'
        required: true
        type: string
        default: '1.5.0'
      approval-required:
        description: 'Require manual approval for apply'
        required: false
        type: boolean
        default: false
      approvers:
        description: 'Comma-separated GitHub usernames or team slugs for notifications (e.g., user1,user2,@team-slug)'
        required: false
        type: string
        default: 'apatten001'  # No approvers if empty
      issue-title:
        description: 'Custom issue title for approval'
        required: false
        type: string
        default: 'Manual Approval: Deploy RDS to ${{ inputs.environment }}'
    secrets:
      AWS_ROLE_ARN:
        description: 'ARN of the AWS IAM role for OIDC'
        required: true

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC
      contents: read
      issues: write   # Required for creating/assigning issues

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: GitHubActions-${{ github.workflow }}-${{ github.run_id }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}

    - name: Terraform Init
      working-directory: ./terraform/rds
      run: terraform init -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}" -backend-config="dynamodb_table=${{ vars.TERRAFORM_LOCK_TABLE }}"

    - name: Terraform Format Check
      working-directory: ./terraform/rds
      run: terraform fmt -check

    - name: Terraform Validate
      working-directory: ./terraform/rds
      run: terraform validate

    - name: Terraform Plan
      timeout-minutes: 10
      working-directory: ./terraform/rds
      id: plan
      run: |
        terraform plan -var-file=${{inputs.environment}}.tfvars -var="environment=${{ inputs.environment }}" -var="aws_region=${{ inputs.aws-region }}" -var="project_name=${{ github.repository }}" -out=tfplan
        echo "planfile=$(pwd)/tfplan" >> $GITHUB_OUTPUT

    - name: Approval for Apply (if required)
      if: inputs.approval-required == 'true' && github.ref == 'refs/heads/main'
      id: approval
      uses: trstringer/manual-approval@v1
      timeout-minutes: 30  # Fail after 30 min if no response
      with:
        secret: ${{ secrets.GITHUB_TOKEN }}
        approvers: ${{ inputs.approvers }}
        minimum-approvals: 1
        issue-title: ${{ inputs.issue-title }}
        issue-body: |  # Customize with details, e.g., attach plan output
          ## Deployment Details
          - Environment: ${{ inputs.environment }}
          - AWS Region: ${{ inputs.aws-region }}
          - Run ID: ${{ github.run_id }}
          - Terraform Plan: [View Plan](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          Please review and comment **approve** or **deny** to proceed.
        notify-assignees-on-approval: true  # Optional: Extra notification on approval

    - name: Terraform Apply
      if: (inputs.approval-required != 'true' || steps.approval.outcome == 'success') && github.ref == 'refs/heads/main'
      working-directory: ./terraform/rds
      run: terraform apply -auto-approve tfplan

    - name: Terraform Destroy (on failure or manual trigger)
      if: failure() && inputs.approval-required == 'true'
      working-directory: ./terraform/rds

      run: terraform destroy -auto-approve

